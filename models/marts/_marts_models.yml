version: 2

models:
  - name: mart_revenue
    description: "Monthly revenue breakdown by category for delivered orders"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: order_month
        tests:
          - not_null
      - name: gross_revenue
        tests:
          - not_null
      - name: category_name
        tests:
          - not_null

  - name: mart_seller_performance
    description: "Seller KPIs: revenue, orders, ratings, quartiles"
    columns:
      - name: seller_id
        tests:
          - not_null
          - unique
      - name: total_orders
        tests:
          - not_null
      - name: total_revenue
        tests:
          - not_null
      - name: revenue_quartile
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]

  - name: mart_delivery_analysis
    description: "Delivery time breakdown and on-time status per order"
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: delivery_status
        tests:
          - not_null
          - accepted_values:
              values: ['on_time', 'late']
      - name: total_delivery_days
        tests:
          - not_null

  - name: mart_customer_ltv
    description: "Customer lifetime value with segmentation"
    columns:
      - name: customer_unique_id
        tests:
          - not_null
          - unique
      - name: lifetime_value
        tests:
          - not_null
      - name: customer_segment
        tests:
          - not_null
          - accepted_values:
              values: ['one_time', 'returning', 'loyal']
      - name: ltv_quintile
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]

  - name: mart_reviews
    description: "Monthly review aggregates with NPS-style scoring by category"
    columns:
      - name: review_month
        tests:
          - not_null
      - name: avg_score
        tests:
          - not_null
      - name: total_reviews
        tests:
          - not_null
