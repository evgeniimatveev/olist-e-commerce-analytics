name: Deploy to HuggingFace Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "evgeniimatveevusa@gmail.com"
          git config --global user.name "evgeniimatveev"
          git clone https://evgeniimatveevusa:${HF_TOKEN}@huggingface.co/spaces/evgeniimatveevusa/olist-analytics hf_space
          rsync -av --exclude='.git' --exclude='assets/' --exclude='data/' --exclude='.github/' --exclude='target/' --exclude='dbt_packages/' --exclude='logs/' --exclude='hf_space/' --exclude='README.md' . hf_space/
          printf '---\ntitle: Olist Analytics\nemoji: 📦\ncolorFrom: blue\ncolorTo: green\nsdk: docker\napp_port: 8501\npinned: false\n---\n' > hf_space/README.md
          cd hf_space
          git add -A
          git diff --cached --quiet || git commit -m "sync: deploy from GitHub $(git -C .. rev-parse --short HEAD)"
          git push