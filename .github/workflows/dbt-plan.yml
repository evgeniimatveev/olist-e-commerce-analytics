name: dbt schema report

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dbt-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  schema-report:
    runs-on: ubuntu-latest
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Report compiled column changes and downstream impact
        uses: PresentJay/dbt-plan@d98f06e8674a1e68a009112b90d0d00c41416c33 # wrapper v0.18.5
        with:
          version: '0.18.6'
          compile-command: >-
            ./.venv/bin/dbt compile --profiles-dir .
          fail-on: never
